name: Package Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: cargo test --workspace --locked
      - run: python scripts/words-generate.py --check
      - run: pnpm contracts:generate --check
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - run: pnpm build:desktop
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force
          Get-ChildItem target/release/bundle/nsis/*.exe | Copy-Item -Destination release
      - run: pnpm build:desktop:offline
      - shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination (Join-Path release ($_.BaseName + '-offline.exe')) }
      - run: node scripts/checksums.mjs release
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*
          body: |
            Windows x64 per-user installers. Standard installation may download WebView2 on a fresh PC. Choose the offline installer when the runtime cannot be downloaded.

            Compare SHA256SUMS.txt before installation. This draft must pass the packaged Windows smoke checklist before publication. Unsigned downloads may show system trust warnings.
