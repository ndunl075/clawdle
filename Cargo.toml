[workspace]
members = ["crates/agent-adapters", "crates/local-runtime", "crates/local-bridge", "apps/desktop/src-tauri"]
default-members = ["crates/agent-adapters", "crates/local-runtime", "crates/local-bridge"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
